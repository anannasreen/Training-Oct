<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="newAdm.css" />
    <title>Admission</title>
  </head>
  <body>
    <div class="student-admission">
      <div class="details">
        <h1>Enter the details of the Student</h1>
        <form>
          <div class="name">
            <label for="name">Name of the Student</label>
            <input type="text" name="name" id="name" />
          </div>
          <div class="age">
            <label for="age">Age of student</label>
            <input type="number" name="age" id="age" min="5" value="5" />
          </div>
          <div class="parent-name">
            <label for="parent-name">Name of Guardian</label>
            <input type="text" />
          </div>
          <div class="address">
            <p>Enter Address</p>
            <textarea name="address" id="address" cols="30" rows="3"></textarea>
          </div>
          <div class="parent-name">
            <label for="parent-name">Father's Name:</label>
            <input type="text" />
          </div>
          <div class="occupation">
            <label for="occupation">Father's occupation</label>
            <input type="text" />
          </div>
          <div class="parent-name">
            <label for="parent-name">Mother's name</label>
            <input type="text" />
          </div>
          <div class="occupation">
            <label for="occupation">Mother's occupation</label>
            <input type="text" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
